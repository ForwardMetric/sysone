# Read the Docs: https://sysone.readthedocs.io
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # CPU-only torch keeps the build small; the docs import sysone but never run a model.
      - VIRTUAL_ENV="${READTHEDOCS_VIRTUALENV_PATH}" uv pip install --torch-backend cpu -e . --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
