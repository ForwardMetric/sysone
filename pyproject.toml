[project]
name = "sysone"
dynamic = ["version"]
description = "Fine-tune and calibrate system-one decision models with a scikit-learn style fit / predict interface."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Goutham Balaraman" }]
requires-python = ">=3.10"
keywords = ["decision models", "classification", "fine-tuning", "lora", "qlora", "transformers",
            "modernbert", "qwen", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Minimums are tested in CI (resolution "lowest-direct"); raise them only with a test that needs it.
dependencies = [
    "numpy>=1.26",
    "torch>=2.8",  # training the backbone on Apple MPS fails in backward kernels before 2.8
    "transformers>=5.3",  # 5.0's ModernBERT ignores per-layer-type attention masks; EuroBERT arrived in 5.3
    "peft>=0.13",
    "safetensors>=0.4.3",
    "huggingface-hub>=1.3",
    # 4-bit training (the default tuning="qlora") is supported on these platforms only;
    # elsewhere sysone falls back to tuning="lora".
    "bitsandbytes>=0.45; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ForwardMetric/sysone"
Documentation = "https://sysone.readthedocs.io"
Changelog = "https://sysone.readthedocs.io/en/latest/changelog.html"
Repository = "https://github.com/ForwardMetric/sysone"
Issues = "https://github.com/ForwardMetric/sysone/issues"
Design = "https://github.com/ForwardMetric/sysone/blob/main/docs/DESIGN.md"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pandas>=2.0",
    "tokenizers>=0.20",
    "ipykernel>=7.3.0",
    "datasets>=5.1.0",
]
docs = [
    "myst-nb>=1.1",
    "numpydoc>=1.8",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8.1",
    "sphinx-copybutton>=0.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sysone/version.py"

[tool.hatch.build.targets.sdist]
include = ["src/sysone", "tests", "docs", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/sysone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads real models from the Hugging Face Hub (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031", "B905"]  # %-formatting is used throughout; zips pair equal-length lists
